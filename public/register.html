<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Administrativo - CLINIMANT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' } } } } }
    </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 transition-colors duration-300 flex items-center justify-center h-screen">

    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md mx-4 border border-slate-200 dark:border-slate-700">
        <div class="text-center mb-8">
            <img src="/logo.jpg" alt="CLINIMANT Logo" class="w-24 h-24 mx-auto rounded-full shadow-lg shadow-brand-500/20 mb-4 object-cover border-4 border-white">
            <h2 class="text-2xl font-bold text-slate-800 dark:text-white">Registrar Administrador</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Crea una nueva cuenta de acceso</p>
        </div>

        <form id="registerForm" class="space-y-5" onsubmit="handleRegister(event)">
            <div id="authError" class="hidden p-3 bg-red-50 text-red-600 text-sm font-bold rounded-lg border border-red-200 text-center"></div>
            
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Nuevo Usuario</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="authUser" placeholder="Ej. administrador" required class="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl bg-slate-50 text-slate-900 font-medium placeholder-slate-400 focus:ring-2 focus:ring-brand-500 transition-all dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:placeholder-slate-500">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Contraseña</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="password" id="authPass" placeholder="••••••••" required class="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl bg-slate-50 text-slate-900 font-medium placeholder-slate-400 focus:ring-2 focus:ring-brand-500 transition-all dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:placeholder-slate-500">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-brand-600 to-brand-500 text-white rounded-xl font-bold text-lg hover:shadow-lg hover:shadow-brand-500/30 transition-all active:scale-95">Registrar Cuenta</button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
            <p>¿Ya tienes cuenta? <a href="/login.html" class="text-brand-600 font-bold hover:underline">Iniciar Sesión</a></p>
        </div>
    </div>

    <!-- Pantalla de Carga -->
    <div id="registerLoader" class="fixed inset-0 bg-slate-100 dark:bg-slate-900 z-[200] flex flex-col items-center justify-center transition-opacity duration-300 opacity-0 hidden">
        <img src="/logo.jpg" alt="Logo" class="w-28 h-28 rounded-full shadow-xl shadow-brand-500/20 mb-8 object-cover border-4 border-white animate-pulse">
        <div class="flex gap-2 mb-4">
            <div class="w-3 h-3 bg-brand-500 rounded-full animate-bounce" style="animation-delay: 0s"></div>
            <div class="w-3 h-3 bg-brand-500 rounded-full animate-bounce" style="animation-delay: 0.15s"></div>
            <div class="w-3 h-3 bg-brand-500 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
        </div>
        <p class="text-slate-500 dark:text-slate-400 font-bold tracking-widest text-sm uppercase">Registrando Administrador...</p>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('authUser').value;
            const p = document.getElementById('authPass').value;
            const errDiv = document.getElementById('authError');
            const loader = document.getElementById('registerLoader');
            
            loader.classList.remove('hidden');
            setTimeout(() => loader.classList.remove('opacity-0'), 10);
            
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const data = await res.json();
                
                if(data.error) {
                    loader.classList.add('opacity-0');
                    setTimeout(() => loader.classList.add('hidden'), 300);
                    errDiv.innerText = data.error;
                    errDiv.classList.remove('hidden');
                } else {
                    alert('Administrador registrado correctamente. Ahora puedes iniciar sesión.');
                    window.location.href = '/login.html';
                }
            } catch(error) {
                loader.classList.add('opacity-0');
                setTimeout(() => loader.classList.add('hidden'), 300);
                errDiv.innerText = 'Error de conexión con el servidor.';
                errDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
